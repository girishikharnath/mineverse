<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mineverse Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* Hide scrollbar for clean UI but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Coal mines data
        const coalMinesData = [
            { state: "Jharkhand", mines: ["Jharia", "Bokaro", "Giridih (Karbhari)", "North/South Karanpura", "Ramgarh", "Daltonganj", "Godda", "Jayanti"] },
            { state: "Chhattisgarh", mines: ["Korba", "Bishrampur", "Sonhat", "Jhilmil", "Hasdo-Arand", "Gevra", "Kusmunda", "Dipka"] },
            { state: "Odisha", mines: ["Talcher", "Ib Valley", "Jharsuguda", "Himgiri", "Rampur", "Bhubaneswari"] },
            { state: "West Bengal", mines: ["Raniganj", "Birbhum", "Chinakuri", "Dalingkot (Darjeeling)", "Bankura"] },
            { state: "Madhya Pradesh", mines: ["Singrauli", "Sohagpur", "Umaria", "Johila", "Satpura", "Bisrampur", "Mohapani"] },
            { state: "Telangana / AP", mines: ["Singareni", "Kothagudem", "Kantapalli", "Kamavaram"] },
            { state: "Maharashtra", mines: ["Kamptee", "Wun", "Wardha", "Walarpur", "Ghughus", "Warora", "Rajur", "Bandar", "Chikiyala", "Kota"] },
            { state: "Tamil Nadu", mines: ["Neyveli"] },
            { state: "Gujarat", mines: ["Ghunkeri"] },
            { state: "Assam", mines: ["Makum", "Ledo", "Najira", "Janji", "Jaipur"] },
            { state: "Meghalaya", mines: ["Darrangiri", "Cherrapunji", "Laitryngew", "Maolong", "Langrin"] }
        ];

        // Flatten array for list view
        const allMines = coalMinesData.flatMap(region => 
            region.mines.map((mine, index) => ({
                id: `${region.state}-${index}`,
                name: `${mine} Coalfield`,
                state: region.state,
                risk: ['HIGH', 'MEDIUM', 'LOW'][Math.floor(Math.random() * 3)],
                violations: Math.floor(Math.random() * 10) + 1
            }))
        );

        // Simulated DGMS Alerts
        const dgmsAlerts = [
            { id: 1, title: "DGMS Tech Circular - Safety Guidelines for Monsoon (PDF)", date: "2026-08-15" },
            { id: 2, title: "Notification: Amendments to Open Cast Working Regulations (PDF)", date: "2026-09-01" },
            { id: 3, title: "Alert: Gas Emissions Standards in Deep Shaft Mines (PDF)", date: "2026-09-05" },
        ];

        function App() {
            const [activeMenu, setActiveMenu] = useState('Overview');
            const [workingModule, setWorkingModule] = useState(null);
            const [alertsOpen, setAlertsOpen] = useState(false);
            const [editMode, setEditMode] = useState(false);
            const [selectedMine, setSelectedMine] = useState(allMines[3]); 
            
            // Reference for scrolling
            const minesSectionRef = useRef(null);

            useEffect(() => {
                lucide.createIcons();
            });

            const handleMenuClick = (menu) => {
                if (menu === 'Overview') {
                    setActiveMenu(menu);
                } else {
                    setWorkingModule(menu);
                }
            };

            // Smooth scroll function
            const scrollToMinesSection = () => {
                minesSectionRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            };

            const menuItems = [
                { name: 'Overview', icon: 'layout-dashboard' },
                { name: 'Compliance Tracker', icon: 'check-square', badge: 37 },
                { name: 'Inspections', icon: 'clock' },
                { name: 'AI Risk Analytics', icon: 'activity' },
                { name: 'Field Reporting', icon: 'map-pin' },
                { name: 'Contractor Management', icon: 'briefcase' },
                { name: 'GIS Compliance Map', icon: 'map' },
                { name: 'Reports & Escalations', icon: 'alert-triangle', badge: 6 },
                { name: 'Secure Audit Trail', icon: 'shield-check' },
                { name: 'Settings', icon: 'settings' },
            ];

            return (
                <div className="flex h-screen bg-gray-50 overflow-hidden text-sm">
                    {/* Sidebar Menu */}
                    <div className="w-64 bg-[#1e2329] text-gray-300 flex flex-col h-full shrink-0">
                        <div className="p-5 border-b border-gray-700">
                            <h1 className="text-xl font-bold text-white flex items-center gap-2">
                                <span className="text-orange-500">▲</span> Mineverse
                            </h1>
                            <p className="text-xs text-gray-400 mt-1">Statutory Compliance & Field Governance</p>
                        </div>
                        <nav className="flex-1 p-4 space-y-1 overflow-y-auto no-scrollbar">
                            {menuItems.map((item) => (
                                <button
                                    key={item.name}
                                    onClick={() => handleMenuClick(item.name)}
                                    className={`w-full flex items-center justify-between p-2.5 rounded-lg transition-colors ${activeMenu === item.name ? 'bg-gray-800 text-white' : 'hover:bg-gray-700 hover:text-white'}`}
                                >
                                    <div className="flex items-center gap-3">
                                        <i data-lucide={item.icon} className="w-4 h-4"></i>
                                        <span>{item.name}</span>
                                    </div>
                                    {item.badge && (
                                        <span className="bg-red-900/80 text-red-200 text-xs px-2 py-0.5 rounded-full font-semibold">
                                            {item.badge}
                                        </span>
                                    )}
                                </button>
                            ))}
                        </nav>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col h-full overflow-hidden">
                        {/* Topbar */}
                        <header className="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6 shrink-0">
                            <h2 className="text-lg font-semibold text-yellow-600 tracking-wide uppercase">SMART COAL GOVERNANCE</h2>
                            
                            <div className="flex items-center gap-6">
                                <div className="relative">
                                    <i data-lucide="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4"></i>
                                    <input 
                                        type="text" 
                                        placeholder="Search mine, inspection ID, contractor..." 
                                        className="pl-9 pr-4 py-1.5 border border-gray-200 rounded-md w-72 text-sm focus:outline-none focus:ring-1 focus:ring-yellow-500 bg-gray-50"
                                    />
                                </div>

                                <button 
                                    onClick={() => setAlertsOpen(true)}
                                    className="relative p-2 text-gray-500 hover:text-gray-800 transition-colors bg-gray-100 rounded-full"
                                    title="View DGMS PDF Alerts"
                                >
                                    <i data-lucide="bell" className="w-5 h-5"></i>
                                    <span className="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">
                                        {dgmsAlerts.length}
                                    </span>
                                </button>

                                <div className="flex items-center gap-3 pl-6 border-l border-gray-200">
                                    <div className="w-8 h-8 bg-blue-800 text-white rounded-full flex items-center justify-center font-bold text-sm">
                                        RS
                                    </div>
                                    <div className="text-sm">
                                        <p className="font-bold text-gray-800">R. Sengupta</p>
                                        <p className="text-xs text-gray-500">Director, Corporate Safety</p>
                                    </div>
                                </div>
                            </div>
                        </header>

                        {/* Dashboard Overview */}
                        <main className="flex-1 overflow-y-auto p-6 bg-[#fbfbfa]">
                            
                            {/* KPI Metrics */}
                            <div className="grid grid-cols-4 gap-4 mb-6">
                                {/* Scroll Trigger Added Here */}
                                <div 
                                    onClick={scrollToMinesSection}
                                    className="bg-white p-5 rounded-lg border border-gray-200 shadow-sm cursor-pointer hover:shadow-md hover:border-blue-300 transition-all group"
                                    title="Click to view all mines"
                                >
                                    <div className="flex justify-between items-start">
                                        <p className="text-xs text-gray-500 font-semibold uppercase group-hover:text-blue-600 transition-colors">Total Coal Mines</p>
                                        <i data-lucide="arrow-down-circle" className="w-4 h-4 text-gray-300 group-hover:text-blue-500"></i>
                                    </div>
                                    <p className="text-3xl font-bold text-red-600 mt-2">{allMines.length}</p>
                                    <p className="text-xs text-red-700 mt-2 font-medium">▲ {allMines.length} Mines Live</p>
                                </div>

                                <div className="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                                    <p className="text-xs text-gray-500 font-semibold uppercase">Open violations</p>
                                    <p className="text-3xl font-bold text-red-600 mt-2">37</p>
                                    <p className="text-xs text-red-700 mt-2 font-medium">▲ 6 new this week</p>
                                </div>
                                <div className="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                                    <p className="text-xs text-gray-500 font-semibold uppercase">Inspections this month</p>
                                    <p className="text-3xl font-bold text-gray-800 mt-2">214</p>
                                    <p className="text-xs text-green-700 mt-2 font-medium">▲ 18% vs target</p>
                                </div>
                                <div className="bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                                    <p className="text-xs text-gray-500 font-semibold uppercase">Corrective actions overdue</p>
                                    <p className="text-3xl font-bold text-orange-500 mt-2">15</p>
                                    <p className="text-xs text-gray-500 mt-2 font-medium">4 past 30 days</p>
                                </div>
                            </div>

                            <div className="grid grid-cols-4 gap-4 mb-8">
                                {[
                                    { title: 'Mine & Lease', desc: 'Mine ID, operator, subsidiary, location, mine type, status, lease/permit metadata', color: '#2563eb' },
                                    { title: 'Compliance', desc: 'Requirement, regulation/section, applicability, due date, submission, status, evidence', color: '#16a34a' },
                                    { title: 'Inspections', desc: 'Inspection ID, inspector, mine/area, checklist, findings, timestamp, GPS, attachments', color: '#dc2626' },
                                    { title: 'Safety & Incidents', desc: 'Hazard, violation, incident, severity, location, root cause, corrective action, closure', color: '#f97316' },
                                    { title: 'Environment', desc: 'Dust/air, water, noise, emissions, waste, sample date, reading, unit, threshold', color: '#6366f1' },
                                    { title: 'Production & Assets', desc: 'Production, equipment/asset ID, maintenance, inspection, downtime, operational indicators', color: '#9333ea' },
                                    { title: 'Workers & Contractors', desc: 'Worker/contractor ID, role, shift, attendance, training/certification, contract status', color: '#0d9488' },
                                    { title: 'Grievances & Reports', desc: 'Complaint, category, owner, SLA/due date, status, response, regulatory/statutory report', color: '#1f2937' }
                                ].map(cat => (
                                    <div key={cat.title} className="bg-white p-4 rounded-lg border border-gray-200 shadow-sm flex flex-col items-center text-center border-t-4" style={{borderTopColor: cat.color}}>
                                        <h3 className="font-bold text-gray-800 text-[13px] mb-2">{cat.title}</h3>
                                        <p className="text-[11px] text-gray-500 leading-tight">{cat.desc}</p>
                                    </div>
                                ))}
                            </div>

                            {/* Target Ref added to this container */}
                            <div ref={minesSectionRef} className="pt-4 flex justify-between items-center mb-4">
                                <h3 className="text-sm font-bold text-gray-400 uppercase tracking-wider">Mines under monitoring</h3>
                                
                                <button 
                                    onClick={() => setEditMode(true)}
                                    className="flex items-center gap-2 bg-blue-50 text-blue-700 border border-blue-200 px-4 py-2 rounded shadow-sm hover:bg-blue-100 transition-colors font-semibold"
                                >
                                    <i data-lucide="edit" className="w-4 h-4"></i> Edit / Add for Later
                                </button>
                            </div>

                            <div className="flex gap-4 h-[550px]">
                                <div className="w-[30%] bg-white rounded-lg border border-gray-200 overflow-y-auto flex flex-col no-scrollbar">
                                    {allMines.map((mine) => (
                                        <div 
                                            key={mine.id}
                                            onClick={() => setSelectedMine(mine)}
                                            className={`p-4 border-b border-gray-100 cursor-pointer transition-colors ${selectedMine.id === mine.id ? 'bg-[#fffdf7] border-l-4 border-l-orange-400' : 'hover:bg-gray-50 border-l-4 border-l-transparent'}`}
                                        >
                                            <h4 className="font-bold text-[13px] text-gray-900 mb-1">{mine.name}</h4>
                                            <p className="text-[11px] text-gray-500 mb-2">{mine.state} - Coal - Lic. {mine.state.substring(0,2).toUpperCase()}-MC-{Math.floor(1000 + Math.random() * 9000)}</p>
                                            <div className="flex items-center gap-2 text-[10px] font-bold">
                                                <span className={`${mine.risk === 'HIGH' ? 'text-red-600' : mine.risk === 'MEDIUM' ? 'text-orange-600' : 'text-green-600'}`}>
                                                    {mine.risk} RISK
                                                </span>
                                                <span className="text-gray-400">•</span>
                                                <span className="text-gray-500">{mine.violations} violations</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="w-[70%] bg-white rounded-lg border border-gray-200 p-6 flex flex-col overflow-y-auto no-scrollbar">
                                    <div className="flex justify-between items-start mb-6">
                                        <div>
                                            <h2 className="text-xl font-bold text-gray-900">{selectedMine.name}</h2>
                                            <p className="text-xs text-gray-400 mt-1">Mine ID {selectedMine.id.split('-')[1]} • Compliance computed from 19 requirements</p>
                                        </div>
                                        <div className="text-right">
                                            <p className={`text-[10px] font-bold tracking-wide uppercase ${selectedMine.risk === 'HIGH' ? 'text-red-600' : selectedMine.risk === 'MEDIUM' ? 'text-orange-500' : 'text-green-600'}`}>
                                                {selectedMine.risk} RISK
                                            </p>
                                            <p className="text-3xl font-bold text-gray-800">
                                                {(100 - (selectedMine.violations * 4.3)).toFixed(1)}%
                                            </p>
                                            <p className="text-[10px] text-gray-400 mt-1">{selectedMine.violations} violations • 2 warnings • 1 pending</p>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-5 gap-6 mb-8 border-b border-gray-100 pb-8">
                                        {[
                                            { label: 'Environment', val: '10%' },
                                            { label: 'Safety', val: '50%' },
                                            { label: 'Production', val: '100%' },
                                            { label: 'Licensing', val: '83.3%' },
                                            { label: 'Reclamation', val: '0%' },
                                        ].map(stat => (
                                            <div key={stat.label}>
                                                <p className="text-[11px] font-bold text-gray-500 mb-2">{stat.label}</p>
                                                <p className="text-lg text-gray-800 mb-2">{stat.val}</p>
                                                <div className="w-full bg-gray-100 h-1.5 rounded-full overflow-hidden">
                                                    <div className="bg-red-900 h-full" style={{width: stat.val}}></div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="flex-1">
                                        <h4 className="font-bold text-gray-800 mb-1">Licensing requirements</h4>
                                        <p className="text-xs text-gray-500 mb-4">Click a requirement to see the evidence behind its status.</p>
                                        
                                        <div className="space-y-3">
                                            {[
                                                { id: 'LIC-01', text: 'Valid mining lease', status: 'PASS', critical: true },
                                                { id: 'LIC-02', text: 'Environmental clearance validity', status: 'UNCERTAIN', critical: true },
                                                { id: 'LIC-03', text: 'Consent to Operate (State Pollution Control Board)', status: 'PASS', critical: false },
                                            ].map(req => (
                                                <div key={req.id} className="flex items-center justify-between p-3 border-b border-gray-100 hover:bg-gray-50 cursor-pointer group transition-colors">
                                                    <div className="flex items-center gap-6">
                                                        <span className="text-gray-400 font-mono text-[11px]">{req.id}</span>
                                                        <span className="text-sm text-gray-700 font-medium group-hover:text-blue-600">{req.text}</span>
                                                        {req.critical && <span className="text-[10px] text-red-500 font-bold tracking-wider">CRITICAL</span>}
                                                    </div>
                                                    <span className={`text-[10px] font-bold px-3 py-1 rounded ${
                                                        req.status === 'PASS' ? 'text-green-700 bg-green-50 border border-green-200' : 'text-gray-600 bg-gray-100 border border-gray-200'
                                                    }`}>
                                                        {req.status}
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>

                    {/* Modals remain exactly the same */}
                    {workingModule && (
                        <div className="fixed inset-0 bg-gray-900/40 flex items-center justify-center z-50 backdrop-blur-sm">
                            <div className="bg-white rounded-lg p-8 max-w-sm w-full shadow-2xl transform transition-all flex flex-col items-center text-center">
                                <div className="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mb-4">
                                    <i data-lucide="wrench" className="text-blue-600 w-8 h-8"></i>
                                </div>
                                <h2 className="text-xl font-bold text-gray-900 mb-2">We are working</h2>
                                <p className="text-sm text-gray-500 mb-6">
                                    The new <span className="font-bold text-gray-800">"{workingModule}"</span> window is currently under construction. Please check back soon.
                                </p>
                                <button 
                                    onClick={() => setWorkingModule(null)}
                                    className="bg-gray-900 text-white px-6 py-2.5 rounded text-sm font-semibold hover:bg-gray-800 transition-colors w-full"
                                >
                                    Close Window
                                </button>
                            </div>
                        </div>
                    )}

                    {alertsOpen && (
                        <div className="fixed inset-0 bg-gray-900/40 flex items-center justify-center z-50 backdrop-blur-sm">
                            <div className="bg-white rounded-lg max-w-2xl w-full shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
                                <div className="p-5 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                                    <div>
                                        <h2 className="text-lg font-bold text-gray-900 flex items-center gap-2">
                                            <i data-lucide="file-text" className="text-red-600 w-5 h-5"></i> Official DGMS Alerts & Circulars
                                        </h2>
                                        <p className="text-[11px] text-gray-500 mt-1">Sourced from: https://www.dgms.gov.in/UserView/index?mid=1362</p>
                                    </div>
                                    <button onClick={() => setAlertsOpen(false)} className="text-gray-400 hover:text-gray-700 bg-gray-200/50 p-2 rounded-full">
                                        <i data-lucide="x" className="w-4 h-4"></i>
                                    </button>
                                </div>
                                <div className="p-6 overflow-y-auto bg-gray-50/50">
                                    <div className="space-y-4">
                                        {dgmsAlerts.map(alert => (
                                            <div key={alert.id} className="p-4 bg-white border border-gray-200 rounded-lg hover:shadow-md transition-shadow group">
                                                <div className="flex items-start justify-between">
                                                    <div>
                                                        <h3 className="font-bold text-gray-800 text-sm">{alert.title}</h3>
                                                        <p className="text-[11px] text-gray-500 mt-1">Published: {alert.date}</p>
                                                    </div>
                                                    <button className="text-blue-600 text-xs font-bold bg-blue-50 px-3 py-1.5 rounded border border-blue-100 flex items-center gap-2 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                                                        <i data-lucide="download" className="w-3 h-3"></i> Download PDF
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {editMode && (
                        <div className="fixed inset-0 bg-gray-900/40 flex items-center justify-center z-50 backdrop-blur-sm">
                            <div className="bg-white rounded-lg p-6 max-w-md w-full shadow-2xl">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-lg font-bold text-gray-900 flex items-center gap-2">
                                        <i data-lucide="save" className="w-5 h-5 text-blue-600"></i> Add / Edit for Later
                                    </h2>
                                    <button onClick={() => setEditMode(false)} className="text-gray-400 hover:text-gray-700">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-[11px] font-bold text-gray-600 uppercase tracking-wider mb-1">Coalfield Name</label>
                                        <input type="text" className="w-full border border-gray-300 rounded p-2.5 text-sm focus:ring-1 focus:ring-blue-500 focus:outline-none" placeholder="Enter mine name" />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-bold text-gray-600 uppercase tracking-wider mb-1">Select State Region</label>
                                        <select className="w-full border border-gray-300 rounded p-2.5 text-sm focus:ring-1 focus:ring-blue-500 focus:outline-none bg-white">
                                            {coalMinesData.map(region => (
                                                <option key={region.state} value={region.state}>{region.state}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div className="bg-blue-50 p-3 rounded border border-blue-100 mt-4">
                                        <label className="flex items-center gap-3 cursor-pointer">
                                            <input type="checkbox" defaultChecked className="w-4 h-4 text-blue-600 rounded" />
                                            <span className="text-sm font-semibold text-blue-900">Keep option to edit or add for later</span>
                                        </label>
                                        <p className="text-[11px] text-blue-700 mt-1 ml-7">This will save your progress as a draft.</p>
                                    </div>
                                </div>
                                <div className="mt-8 flex gap-3 justify-end border-t border-gray-100 pt-4">
                                    <button onClick={() => setEditMode(false)} className="px-5 py-2 text-sm font-semibold text-gray-600 hover:bg-gray-100 rounded">Cancel</button>
                                    <button onClick={() => setEditMode(false)} className="px-5 py-2 text-sm font-semibold bg-gray-900 text-white rounded hover:bg-gray-800 shadow">Save Draft</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
